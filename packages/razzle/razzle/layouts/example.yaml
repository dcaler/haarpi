# Example razzle layout descriptor — documents the format only. The REAL house master and its
# descriptor live neutral in ~/.config/haarpi/razzle/masters/ (never in any repo); this is a generic
# template, not tied to any real deck.
#
# `master` names the .pptx beside this descriptor; `roles` map razzle's slide roles to the master's
# layouts (by index) and their placeholders (by idx): `text` fills text placeholders, `picture`
# places a figure, `logos` lists placeholder boxes for affiliation/funder logos.
master: master.pptx
size: "16:9"
#
# WATCH THE INDICES: a placeholder's idx is per-LAYOUT. In this example idx13 is the caption strip
# on layout 1 but the right-hand FIGURE box on layout 2. Copying a role between layouts without
# re-reading the master is how citation text ends up inside the figure area.
roles:
  title:   {layout: 0, text: {title: 0, subtitle: 1}, logos: [14]}
  figure:  {layout: 1, text: {title: 0, citation: 13}, picture: {figure: 1}}   # citation slot = source ref only
  content: {layout: 1, text: {title: 0, body: 1}}
  # a point BESIDE its evidence — bullets left, figure right. The workhorse of a results section.
  split:   {layout: 2, text: {title: 0, body: 1, citation: 14}, picture: {figure: 13}}
