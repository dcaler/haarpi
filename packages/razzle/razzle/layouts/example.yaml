# Example razzle layout descriptor — documents the format only. The REAL house master and its
# descriptor live neutral in ~/.config/haarpi/razzle/masters/ (never in any repo); this is a generic
# template, not tied to any real deck.
#
# `master` names the .pptx beside this descriptor; `roles` map razzle's slide roles to the master's
# layouts (by index) and their placeholders (by idx):
#   text        fills text placeholders. A slot takes the SLIDE's value if it has one, else the
#               deck-level `furniture` — which is how `venue`, `footer` and `contact` (the same on
#               every slide, and never the composer's to invent) reach the master's running strips.
#   picture     places a figure.
#   logos       one placeholder box per logo — only for a master that HAS logo placeholders.
#   logo_strip  a row of logos laid out at an explicit box (inches), fitted to its height and
#               centred. Use this when the count is not known ahead of time: it is the only one of
#               the two that can show more than one mark, and an affiliation with no registered
#               logo is set as TEXT in the same row rather than dropped. It belongs on the
#               ACKNOWLEDGEMENTS role, not the title: a title slide's job is the title, the authors
#               and the venue, and the band left over under the byline fits about two small marks.
#
# WATCH THE INDICES: a placeholder's idx is per-LAYOUT. Here idx13 is the caption strip on layout 1
# but the right-hand FIGURE box on layout 2. Copying a role between layouts without re-reading the
# master is how citation text ends up inside the figure area.
master: master.pptx
size: "16:9"                     # informational: the master's own dimensions are what render uses
roles:
  title:   {layout: 0, text: {title: 0, subtitle: 1, venue: 14}}   # no logos, no page number
  figure:  {layout: 1, text: {title: 0, citation: 13, footer: 14, contact: 15},
            picture: {figure: 1}}                            # citation slot = source ref only
  content: {layout: 1, text: {title: 0, body: 1, footer: 14, contact: 15}}
  # a point BESIDE its evidence — bullets left, figure right. The workhorse of a results section.
  split:   {layout: 2, text: {title: 0, body: 1, citation: 14, footer: 15, contact: 16},
            picture: {figure: 13}}
  # the closing slide, and the deck's ONLY home for the affiliation + funder marks. razzle appends
  # it itself from the deck config — the composer is never offered the role.
  acknowledgements:
           {layout: 1, text: {title: 0, body: 1, footer: 14, contact: 15},
            logo_strip: {left: 1.33, top: 3.60, width: 10.67, height: 1.20, gap: 0.60}}
